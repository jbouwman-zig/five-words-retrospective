<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" fill="none">
  <defs>
    <path id="heart" d="M210 104C190 70 163 57 135 62C92 69 71 103 76 143C83 207 160 268 202 299C207 303 213 303 218 299C260 268 337 207 344 143C349 103 328 69 285 62C257 57 230 70 210 104Z"/>
    <radialGradient id="body" cx="0" cy="0" r="1" gradientTransform="translate(144 99) rotate(55) scale(245 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0ef"/>
      <stop offset=".28" stop-color="#f8c5d5"/>
      <stop offset=".58" stop-color="#e5a0bf"/>
      <stop offset=".84" stop-color="#c976a1"/>
      <stop offset="1" stop-color="#a85888"/>
    </radialGradient>
    <radialGradient id="reflection" cx="0" cy="0" r="1" gradientTransform="translate(291 117) rotate(100) scale(115 72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe2e7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe2e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="0" cy="0" r="1" gradientTransform="translate(209 155) rotate(90) scale(172 156)" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#9a4977" stop-opacity="0"/>
      <stop offset="1" stop-color="#9a4977" stop-opacity=".38"/>
    </radialGradient>
    <linearGradient id="rim" x1="100" y1="75" x2="294" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6f4" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#fff6f4" stop-opacity=".1"/>
      <stop offset="1" stop-color="#b36b94" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="silhouette"><use href="#heart"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ground" x="-50%" y="-200%" width="200%" height="500%">
