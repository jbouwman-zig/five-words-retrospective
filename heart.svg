  <ellipse cx="216" cy="323" rx="83" ry="8" fill="#794d86" opacity=".22" filter="url(#ground)"/>
  <g transform="rotate(-8 210 180)">
    <use href="#heart" fill="url(#body)"/>
    <g clip-path="url(#silhouette)">
      <path d="M66 53H354V307H66Z" fill="url(#reflection)"/>
      <path d="M66 53H354V307H66Z" fill="url(#edge)"/>
      <path d="M96 140C92 101 118 76 148 80C164 82 177 91 187 104" stroke="#fff8f2" stroke-opacity=".75" stroke-width="12" stroke-linecap="round" filter="url(#blur)"/>
      <path d="M241 91C263 70 297 77 314 98" stroke="#fff0f3" stroke-opacity=".45" stroke-width="9" stroke-linecap="round" filter="url(#blur)"/>
      <path d="M306 173C292 211 249 255 220 278" stroke="#8f416f" stroke-opacity=".2" stroke-width="18" stroke-linecap="round" filter="url(#blur)"/>
    </g>
    <use href="#heart" stroke="url(#rim)" stroke-width="1.5"/>
